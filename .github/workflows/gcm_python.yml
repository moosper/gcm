name: GPU Cluster Monitoring Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-venv:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.cache-key }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - uses: actions/cache@v4
      id: cache-venv
      with:
        path: ~/.cache/venv-ci
        key: ${{ env.pythonLocation }}-${{ hashFiles('dev-requirements.txt') }}

    - name: Install python dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv ~/.cache/venv-ci
        source ~/.cache/venv-ci/bin/activate
        pip install -r dev-requirements.txt

  build_deb:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # needed so that setuptools_scm can correctly figure out version at build
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/venv-ci
          key: ${{ env.pythonLocation }}-${{ hashFiles('dev-requirements.txt') }}

      - name: Install Rust
        run: "echo skipped-for-baseline-isolation"
      - name: Install build dependencies
        run: |
          sudo apt update --yes
          sudo apt install --yes build-essential devscripts debhelper

      - name: Setup build directory
        run: "echo skipped-for-baseline-isolation"

      - name: Build Debian
        run: "echo skipped-for-baseline-isolation"
  nox-lint:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: nox lint
        run: "echo skipped-for-baseline-isolation"
  nox-tests:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: nox tests
        run: |
          source ~/.cache/venv-ci/bin/activate
          nox -s tests

  nox-typecheck:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: nox typecheck
        run: "echo skipped-for-baseline-isolation"
  nox-format:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: nox format
        run: "echo skipped-for-baseline-isolation"
  pyoxidizer-build-gcm:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: Build gcm
        run: "echo skipped-for-baseline-isolation"
      - name: Test built binary
        run: "echo skipped-for-baseline-isolation"

  pyoxidizer-build-health_checks:
    needs: setup-venv
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: Build health_checks
        run: "echo skipped-for-baseline-isolation"
      - name: Test built binary
        run: "echo skipped-for-baseline-isolation"
